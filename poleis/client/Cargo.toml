[package]
name = "poleis-client"
version = "0.1.0"
edition = "2021"
description = "Host-side client for the poleis_treasury program: PDAs, instruction encoding, hashing, account views."

[dependencies]
poleis-treasury = { path = "../program/poleis_treasury" }
sha2 = "0.10"
# the BLS side: keys, signatures and their sum, off chain; the program verifies through the syscalls. A default feature (THE FLASK TAKES ITS
# SEAT, Nov 22 2026): the mint door's seat law (poleis/seat-wasm) builds the nft builders for wasm32 with it off; nothing else changes with it
blstrs = { version = "0.7", optional = true }
ff = { version = "0.13", optional = true }
group = { version = "0.13", optional = true }
solana-instruction = "3.2"
solana-pubkey = "4.1"

[features]
default = ["bls"]
bls = ["dep:blstrs", "dep:ff", "dep:group"]

[dev-dependencies]
ed25519-dalek = "2"
# the runtime's own BLS12-381 implementation, to run the program's chain and pairing on the host
solana-bls12-381-syscall = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-hash = "4.5"
solana-message = { version = "=4.4.1", features = ["wincode"] }
