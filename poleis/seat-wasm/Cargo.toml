[package]
name = "poleis-seat-wasm"
version = "0.1.0"
edition = "2021"
description = "THE FLASK TAKES ITS SEAT: a finished Lyssajudron's seat of root 0's floor as one transaction, written by Poleis's own law (the client's mint builders, Solana's own compiler) and compiled once to WASM for the mint door (embertide-app/ui/intro/dyson-society/worker/poleis-seat.wasm): no bindgen, flat buffers, the Poleis it speaks baked in at the build."
license = "UNLICENSED"
publish = false

[lib]
name = "poleis_seat"
crate-type = ["cdylib", "rlib"]

[dependencies]
# the client's nft builders with its BLS side off (blstrs builds no wasm32); the program crate for the sizes `mint_nft` makes its accounts at
poleis-client = { path = "../client", default-features = false }
poleis-treasury = { path = "../program/poleis_treasury" }
# the program's error, as the curve's quote gives it
pinocchio = "0.11"
solana-pubkey = "4.1"
solana-instruction = "3.2"
solana-hash = "4.5"
# Solana's own compiler of the legacy message, the press's
solana-message = { version = "=4.4.1", features = ["wincode"] }
# THE MINE IS LIVE (src/mine.rs): the $WARM program's own layouts, seeds and law, linked beside Poleis and so without its entrypoint
warm-mine = { path = "../program/warm_mine", features = ["no-entrypoint"] }
ed25519-dalek = "2" # classical: the router's oracle signs its receipts with it (the crank holds each to it), Solana's precompile verifies only it, and a Solana transaction is signed with it (the vectors' fixed test keys)
# the mine's one door speaks JSON, as the Worker's glue and a node's answers do
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
