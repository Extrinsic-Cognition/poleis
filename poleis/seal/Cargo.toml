[package]
name = "poleis-seal"
version = "0.1.0"
edition = "2021"
description = "A RELEASE IS A VOTE (Nov 23 2026, his \"the truth is, the swarm deliberates and votes and that lands on solana\"): the one reader of the seal. Given a commit, whether a Poleis proposal of the house's polis that names it is sealed RATUM, by a proposer his key named: the proposal, its class, the seal's slot and its transaction. The law is pure (src/lib.rs); the hand (src/main.rs) only reads a Solana node, by curl, and writes nothing."
license = "UNLICENSED"
publish = false

[[bin]]
name = "poleis-seal"
path = "src/main.rs"

[dependencies]
# the program's own client with its BLS side off (the seat-wasm's way): the proposal's hash, its PDAs, the account views
poleis-client = { path = "../client", default-features = false }
# the program's own constants: the classes, the states, the receipt's domain and kinds, the instruction tags
poleis-treasury = { path = "../program/poleis_treasury" }
solana-pubkey = "4.1"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"

[dev-dependencies]
# the practice chain's hand (examples/practice.rs): the press's own RPC (localnet only) and its signing of Solana's legacy message
poleis-press = { path = "../press" }
# the war's rehearsal's copy of the press's two modules (examples/wish.rs): the same calls, and the one copy that reaches devnet, pinned and paced
poleis-wars-rehearsal = { path = "../program/poleis_wars/rehearsal" }
solana-instruction = "3.2"

[profile.release]
overflow-checks = true
strip = true
