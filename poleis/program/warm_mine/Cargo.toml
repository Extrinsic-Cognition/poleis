[package]
name = "warm-mine"
version = "0.1.0"
edition = "2021"
description = "$WARM mined by use: the program holds $WARM's mint and mines it live by the Space Router's own law (a dollar spent mines 1 $WARM, halving every six calendar months from the opening, uncapped), each spend once, never past the dollars a flask deposited, re-emitting returned $WARM first."
license = "UNLICENSED"
publish = false

[lib]
name = "warm_mine"
crate-type = ["cdylib", "lib"]

[features]
# for a host crate that links this program beside another (the launch press, poleis/press): no entrypoint symbol
no-entrypoint = []

[lints.rust]
# the host toolchain does not know the SBF target's cfg values
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
pinocchio = "0.11"
pinocchio-system = "0.6"
solana-address = { version = "2.6", features = ["decode"] }

# PDA derivation off-chain needs the curve check; on-chain it is a syscall.
# Scoped to host targets so the SBF binary never carries curve25519-dalek.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2.6", features = ["decode", "curve25519"] }

[dev-dependencies]
mollusk-svm = "0.15"
# the real SPL Token and Associated Token programs (their mainnet ELFs), so the mint, the vault and every flask's account are real
mollusk-svm-programs-token = "0.15"
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"
# the known encodings the hand-written byte layouts are held to (tests/wire.rs); never in the program
spl-token-interface = "2"
spl-associated-token-account-interface = "2"
solana-program-pack = "3.1"
# the parity table names the text of the router's law it was made from, by its sha256
sha2 = "0.10"
# THE TOKEN'S FACE (tests/face.rs): a stand-in at Metaplex's id, a builtin that records what it is asked (Metaplex's program is not on
# Mollusk and none is fetched); already in this lock under Mollusk
solana-program-runtime = "=4.2.2"

[profile.release]
overflow-checks = true
