[package]
name = "poleis-roads"
version = "0.1.0"
edition = "2021"
description = "The house's decision market on a chain: boards, balances of play $WARM, roads and positions, beside Poleis and never inside it. The arithmetic is embertide-futarchy's core, called whole; this program keeps the accounts, the checks and the clock."
license = "UNLICENSED"
publish = false

[lib]
name = "poleis_roads"
crate-type = ["cdylib", "lib"]

[lints.rust]
# the host toolchain does not know the SBF target's cfg values
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
pinocchio = "0.11"
pinocchio-system = "0.6"
solana-address = { version = "2.6", features = ["decode"] }
# the market's one law, its core alone: no allocation, no std. The same bytes the fold on a Nest runs.
embertide-futarchy = { path = "../../../crates/embertide-futarchy", default-features = false }

# PDA derivation off-chain needs the curve check; on-chain it is a syscall.
# Scoped to host targets so the SBF binary never carries curve25519-dalek.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2.6", features = ["decode", "curve25519"] }

[dev-dependencies]
# the fold, to hold the program against it trade by trade
embertide-futarchy = { path = "../../../crates/embertide-futarchy", default-features = false, features = ["fold"] }
mollusk-svm = "0.15"
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"

[profile.release]
overflow-checks = true
