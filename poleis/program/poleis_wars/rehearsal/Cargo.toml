[package]
name = "poleis-wars-rehearsal"
version = "0.1.0"
edition = "2021"
description = "The first reference war on a real local validator (Nov 24 2026, lane/the-war-is-its-own-program): poleis_wars at genesis, stand-in keys made in memory, every minute's events and its crank in one transaction landed in that minute of the chain's own clock, and every account read back and held to the owner's reference to the unit. The JSON-RPC and the wire are the launch press's own (src/rpc.rs, src/wire.rs, copied whole)."
license = "UNLICENSED"
publish = false

[[bin]]
name = "war-rehearsal"
path = "src/main.rs"

[dependencies]
# the program's own layouts, tags and id, as its tests read them
poleis-wars = { path = ".." }
# the war's law, its whole war beside the chain (feature std, its default)
embertide-war = { path = "../../../../crates/embertide-war" }
# what the press's two modules stand on (poleis/press/Cargo.toml)
solana-pubkey = "4.1"
solana-instruction = "3.2"
solana-message = { version = "=4.4.1", features = ["wincode"] }
solana-hash = "4.5"
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
ed25519-dalek = "2" # classical: Solana's fee payer signs Solana's own transactions

[profile.release]
overflow-checks = true
