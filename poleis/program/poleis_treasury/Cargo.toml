[package]
name = "poleis-treasury"
version = "0.1.0"
edition = "2021"

[lib]
name = "poleis_treasury"
crate-type = ["cdylib", "lib"]

[lints.rust]
# the host toolchain does not know the SBF target's cfg values
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
pinocchio = { version = "0.11", features = ["account-resize"] }
pinocchio-system = "0.6"
solana-address = { version = "2.6", features = ["decode"] }

# PDA derivation off-chain needs the curve check; on-chain it is a syscall.
# Scoped to host targets so the SBF binary never carries curve25519-dalek.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2.6", features = ["decode", "curve25519"] }

[dev-dependencies]
poleis-client = { path = "../../client" }
# precompiles: Mollusk runs the real Ed25519 verifier on transaction-level
# tests, so `attest` is exercised against genuine signatures
mollusk-svm = { version = "0.15", features = ["precompiles"] }
ed25519-dalek = "2"
sha2 = "0.10"
solana-account = "4.3"
solana-instruction = "3.2"
solana-program-error = "3.0"
solana-pubkey = "4.1"
mollusk-svm-programs-token = "0.15"
spl-token-interface = "2"
solana-svm-log-collector = "4.2"
base64 = "0.22"
# THE ROUTER DRAWS ITS MONTH: the door's own law (src/mine.rs), its message's instructions sent on the real programs (tests/council.rs)
poleis-seat-wasm = { path = "../../seat-wasm" }

[profile.release]
overflow-checks = true
