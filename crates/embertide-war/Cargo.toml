[package]
name = "embertide-war"
version = "0.1.0"
edition = "2021"
description = "The price wars' one law in integers (Nov 24 2026; his \"Yes, build it\" to \"Build the war's program first, on a local validator?\"): two houses on pump.fun's curve priced in SOL, a raid opened by a stake, a line to beat that falls to nothing, a last stand, his half for whoever deserts or changes sides (the coins burned), the loser's pot buying the winner's coin for the loser's holders, and the dump tax. The law (src/law.rs) is pure and has no dependency; the whole war over a script (feature std) is built on it."
license = "UNLICENSED"
publish = false

[features]
default = ["std"]
# the law's core alone needs nothing: no allocation, no std (what a program on a chain depends on, with default-features = false). `std`
# adds the whole war run minute by minute over a script (src/war.rs), the way the owner's model runs it.
std = []

[dev-dependencies]
# the tests read the owner's reference (tests/reference/reference-in-sol.json) as data
serde_json = "1"

[profile.release]
opt-level = 3
overflow-checks = true
